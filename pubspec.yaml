name: past_question_paper_v1
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0+10

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.17
  http: ^1.6.0
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter

flutter_native_splash:
  color: "#F0F0ED"
  image: assets/branding/splash_safe.png
  android: true
  ios: true

  android_12:
    color: "#F0F0ED"
    image: assets/branding/splash_safe.png
    icon_background_color: "#F0F0ED"

flutter_launcher_icons:
  android: ic_launcher
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#F0F0ED"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_foreground_inset: 12
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icons/mathematics_icons/
    - assets/icons/physical_sciences_icons/physical_sciences_icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
