<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Question Papers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F5F5F5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid #E5E5E5;
    }
    .logo { width: 80px; height: 80px; border-radius: 16px; margin-bottom: 24px; }
    h1 { color: #262626; font-size: 24px; margin-bottom: 12px; }
    p { color: #525252; font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background-color: #FF7A1A;
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
    }
    .footer { color: #A3A3A3; font-size: 12px; margin-top: 32px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://storage.googleapis.com/vibe-code-4c59f.firebasestorage.app/public/email-assets/logo.png" alt="PQP Logo" class="logo">
    <h1>Past Question Papers</h1>
    <p>Practice past exam questions and ace your exams. Download the app to get started.</p>
    <a href="https://play.google.com/store/apps/details?id=com.kinetix.past_question_paper" class="btn">Get the App</a>
    <p class="footer">&copy; 2026 Past Question Papers &middot; Kinetix Engineering Solutions</p>
  </div>
</body>
</html>
